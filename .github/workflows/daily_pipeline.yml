name: Daily Football Pipeline & Tests

on:
  schedule:
    - cron: '0 8 * * *' # Roda todo dia às 08:00 AM UTC
  workflow_dispatch:    # Permite acionamento manual no site do GitHub
  push:
    branches: [ main ]  # Roda testes automaticamente a cada push na branch principal
  pull_request:
    branches: [ main ]  # Roda testes em pull requests

jobs:
  run-pipeline-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: python -m pytest

      - name: Run Main ETL Pipeline
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE_URL: https://api.football-data.org/v4
        run: python -m src.main

      # ==========================================
      # ETAPA GCP: ENVIANDO DADOS PARA O DATA LAKE
      # ==========================================
      
      - name: 🔐 Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: ⚙️ Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: ☁️ Sincronizar Dados com o Bucket GCP
        # O 'rsync' espelha a pasta local 'data/gold' exatamente como ela é para dentro do Bucket
        run: |
          gcloud storage rsync -R data/gold/ gs://futebol-datalake-global-analytics-2026/data/gold/